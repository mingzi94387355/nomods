# Shared settings for this multi-module NeoForge 1.21.1 build.
# generate.py reads these values when it writes the per-mod sources and
# neoforge.mods.toml files. Change a value, then re-run generate.py.

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- NeoForge / Minecraft -------------------------------------------------
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.233
loader_version_range=[1,)

# --- Generated mod metadata ----------------------------------------------
mod_version=1.0.0-neoforge1.21.1
mod_authors=mingzi_94387355, deepseek
mod_license=MIT
mod_description=Registers a network channel, sends one hello packet when a player joins, then does nothing else.
nomods_package_root=com.chapple
nomods_protocol_version=1
